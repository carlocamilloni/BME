# Conda environment for BME.
#   conda env create -f environment.yml
#   conda activate bme
# This installs the dependencies from conda-forge and BME itself (editable)
# from this folder, plus pytest and jupyter for the tests and notebooks.
name: bme
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2.2
  - scikit-learn>=1.4.2
  - matplotlib>=3.8.4
  - pytest>=7
  - jupyter
  - pip
  - pip:
      - -e .
