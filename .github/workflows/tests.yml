name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # oldest supported stack (numpy 1.x)
          - os: ubuntu-latest
            python-version: "3.9"
            deps: "numpy<2"
          - os: macos-latest
            python-version: "3.12"
            deps: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "latest" ]; then
            python -m pip install ".[test]"
          else
            python -m pip install ".[test]" "${{ matrix.deps }}"
          fi
      - name: Run tests
        run: python -m pytest
