[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "BME"
dynamic = ["version"]
description = "Bayesian/Maximum Entropy (BME) reweighting of molecular simulations with experimental data"
readme = "README.rst"
# GNU GPL v3, see LICENSE.md
license-files = ["LICENSE.md"]
authors = [
    { name = "Sandro Bottaro" },
    { name = "Tone Bengtsen" },
    { name = "Kresten Lindorff-Larsen" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2.2",
    "scikit-learn>=1.4.2",
    "matplotlib>=3.8.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebooks = ["jupyter"]

[project.urls]
Homepage = "https://github.com/KULL-Centre/BME"

[tool.setuptools]
# BME is distributed as two top-level modules, so that "import BME" keeps
# working exactly as in the notebooks and in existing user scripts
py-modules = ["BME", "BME_tools"]

[tool.setuptools.dynamic]
version = { attr = "BME.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
